<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Home Automation System</title>
    <script>
      // Gracefully silence benign development-only WebSocket and Vite HMR errors
      (function() {
        // 1. Intercept and wrap window.addEventListener to swallow benign errors BEFORE any other listener (like React or platform) can catch them
        var originalAddEventListener = window.addEventListener;
        window.addEventListener = function(type, listener, options) {
          if (type === 'error' || type === 'unhandledrejection') {
            var wrappedListener = function(event) {
              var isBenign = false;
              if (type === 'unhandledrejection') {
                var reason = event.reason ? (event.reason.message || String(event.reason)) : "";
                if (event.detail && event.detail.reason) {
                  reason = event.detail.reason.message || String(event.detail.reason);
                }
                var reasonStr = String(reason);
                if (
                  reasonStr.indexOf('WebSocket') !== -1 || 
                  reasonStr.indexOf('vite') !== -1 || 
                  reasonStr.indexOf('websocket') !== -1 || 
                  reasonStr.indexOf('closed without opened') !== -1 || 
                  reasonStr.indexOf('socket.io') !== -1
                ) {
                  isBenign = true;
                }
              } else if (type === 'error') {
                var message = event.message || '';
                var errorStr = event.error ? (event.error.message || String(event.error)) : '';
                var combined = String(message) + ' ' + String(errorStr);
                if (
                  combined.indexOf('WebSocket') !== -1 || 
                  combined.indexOf('vite') !== -1 || 
                  combined.indexOf('websocket') !== -1 || 
                  combined.indexOf('closed without opened') !== -1 || 
                  combined.indexOf('socket.io') !== -1
                ) {
                  isBenign = true;
                }
              }
              
              if (isBenign) {
                try {
                  event.preventDefault();
                  event.stopPropagation();
                  if (event.stopImmediatePropagation) {
                    event.stopImmediatePropagation();
                  }
                } catch (e) {}
                return; // Swallowed successfully
              }
              
              if (listener) {
                return listener.apply(this, arguments);
              }
            };
            return originalAddEventListener.call(this, type, wrappedListener, options);
          }
          return originalAddEventListener.apply(this, arguments);
        };

        // 2. Intercept and patch WebSocket class to suppress connection errors on instances
        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          var PatchedWebSocket = function(url, protocols) {
            var urlStr = String(url || "");
            var isBenignWs = urlStr.indexOf('vite') !== -1 || urlStr.indexOf('hmr') !== -1 || urlStr.indexOf('socket.io') !== -1 || urlStr.indexOf('3000') !== -1;
            
            if (isBenignWs) {
              // Create a robust dummy WebSocket object that behaves as if closed or failed to connect
              var dummyWs = {
                url: url,
                readyState: 3, // CLOSED
                extensions: "",
                protocol: "",
                binaryType: "blob",
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
                addEventListener: function(type, listener, options) {
                  if (type === 'error' || type === 'close') {
                    setTimeout(function() {
                      try {
                        var ev = { 
                          type: type, 
                          target: dummyWs, 
                          currentTarget: dummyWs, 
                          bubbles: false, 
                          cancelable: false,
                          preventDefault: function() {},
                          stopPropagation: function() {},
                          stopImmediatePropagation: function() {}
                        };
                        if (type === 'close') {
                          ev.code = 1006;
                          ev.reason = "Aborted benign WebSocket connection in AI Studio environment";
                          ev.wasClean = false;
                        }
                        if (typeof dummyWs['on' + type] === 'function') {
                          dummyWs['on' + type](ev);
                        }
                        if (typeof listener === 'function') {
                          if (typeof listener.handleEvent === 'function') {
                            listener.handleEvent(ev);
                          } else {
                            listener(ev);
                          }
                        }
                      } catch (e) {}
                    }, 10);
                  }
                },
                removeEventListener: function() {},
                send: function() {},
                close: function() {
                  this.readyState = 3;
                }
              };
              return dummyWs;
            }

            var ws;
            try {
              if (protocols) {
                ws = new OriginalWebSocket(url, protocols);
              } else {
                ws = new OriginalWebSocket(url);
              }
            } catch (err) {
              console.warn("WebSocket creation bypassed or failed gracefully:", err);
              ws = {
                addEventListener: function() {},
                removeEventListener: function() {},
                send: function() {},
                close: function() {}
              };
            }
            
            try {
              ws.addEventListener('error', function(e) {
                if (urlStr.indexOf('vite') !== -1 || urlStr.indexOf('hmr') !== -1 || urlStr.indexOf('3000') !== -1 || urlStr.indexOf('socket.io') !== -1) {
                  e.preventDefault();
                  e.stopPropagation();
                  if (e.stopImmediatePropagation) {
                    e.stopImmediatePropagation();
                  }
                }
              }, true);
            } catch (attachErr) {}
            
            return ws;
          };
          
          PatchedWebSocket.prototype = OriginalWebSocket.prototype;
          for (var prop in OriginalWebSocket) {
            if (OriginalWebSocket.hasOwnProperty(prop)) {
              PatchedWebSocket[prop] = OriginalWebSocket[prop];
            }
          }
          window.WebSocket = PatchedWebSocket;
        }

        // 3. Suppress console.error and console.warn for development/vite websockets
        var originalConsoleError = console.error;
        var originalConsoleWarn = console.warn;

        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function(arg) {
            try {
              return typeof arg === 'object' ? JSON.stringify(arg) : String(arg);
            } catch (e) {
              return String(arg);
            }
          }).join(' ');
          
          if (
            msg.indexOf('WebSocket') !== -1 || 
            msg.indexOf('vite') !== -1 || 
            msg.indexOf('websocket') !== -1 || 
            msg.indexOf('closed without opened') !== -1 ||
            msg.indexOf('socket.io') !== -1
          ) {
            return;
          }
          originalConsoleError.apply(console, arguments);
        };

        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function(arg) {
            try {
              return typeof arg === 'object' ? JSON.stringify(arg) : String(arg);
            } catch (e) {
              return String(arg);
            }
          }).join(' ');
          
          if (
            msg.indexOf('WebSocket') !== -1 || 
            msg.indexOf('vite') !== -1 || 
            msg.indexOf('websocket') !== -1 || 
            msg.indexOf('closed without opened') !== -1 ||
            msg.indexOf('socket.io') !== -1
          ) {
            return;
          }
          originalConsoleWarn.apply(console, arguments);
        };

        // 4. Intercept direct onerror / onunhandledrejection assignment to wrap them dynamically
        var realOnError;
        Object.defineProperty(window, 'onerror', {
          get: function() { return realOnError; },
          set: function(val) {
            realOnError = function(message, source, lineno, colno, error) {
              var msg = String(message || "") + " " + String(error ? error.message : "");
              if (
                msg.indexOf('WebSocket') !== -1 || 
                msg.indexOf('vite') !== -1 || 
                msg.indexOf('websocket') !== -1 || 
                msg.indexOf('closed without opened') !== -1 || 
                msg.indexOf('socket.io') !== -1
              ) {
                return true; // Suppress
              }
              if (val) return val.apply(this, arguments);
            };
          },
          configurable: true
        });

        var realOnUnhandled;
        Object.defineProperty(window, 'onunhandledrejection', {
          get: function() { return realOnUnhandled; },
          set: function(val) {
            realOnUnhandled = function(event) {
              var reason = event.reason ? (event.reason.message || String(event.reason)) : "";
              var reasonStr = String(reason);
              if (
                reasonStr.indexOf('WebSocket') !== -1 || 
                reasonStr.indexOf('vite') !== -1 || 
                reasonStr.indexOf('websocket') !== -1 || 
                reasonStr.indexOf('closed without opened') !== -1 || 
                reasonStr.indexOf('socket.io') !== -1
              ) {
                event.preventDefault();
                event.stopPropagation();
                return true; // Suppress
              }
              if (val) return val.apply(this, arguments);
            };
          },
          configurable: true
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
